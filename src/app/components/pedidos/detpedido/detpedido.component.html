@if (!isloading){
<div class="ped-container">
    <!-- Sección superior fija -->
    <div class="fixed-section">
      <div class="header mt-3">
        <h4>Detalle de Pedido</h4>   
        
        <div class="col-4">
           <input #filtroInput (keyup)="aplicarFiltro(filtroInput.value)" placeholder="Filtrar por proveedor">
        </div>   
        <button 
                mat-icon-button
                class="action-btn"
                title="imprimir Pedido"
                (click)="generarDetalleCuentaPDF()">
                <i class="bi bi-printer"></i>               
        </button>
       
        <button class="btn btn-warning btn-sm add-button" (click)="agregarItemPedido()">
          <i class="bi bi-plus-circle me-1"></i>Agregar Item
         </button>
      
          <button class="btn btn-secondary btn-sm add-button" (click)="Volver()">
          <i class="bi bi-arrow-left me-1"></i>Volver
         </button>
      
      </div>
    </div>
   
    

     <!-- Sección de tabla con scroll -->
     @if (cantitems!==0) {
     <div class="table-container" style="overflow-x: auto">
       <table
           mat-table
           class="mat-elevation-z8 tabla-fija"
           [dataSource]="this.dataSource">

    
      <!-- Columna Nro.Pedido -->
      <ng-container matColumnDef="nropedido">
        <th mat-header-cell *matHeaderCellDef >Nro.Pedido</th>
        <td mat-cell *matCellDef="let renPed" >
       {{ renPed.nropedido }}</td>
      </ng-container>

      <!-- Columna Nro.renglon -->
      <ng-container matColumnDef="nrorenglon">
        <th mat-header-cell *matHeaderCellDef>Nro.Ren</th>
        <td mat-cell *matCellDef="let renPed">
          {{ renPed.nrorenglon }}</td>
      </ng-container>
       
      <!-- Columna Proveedor -->
      <ng-container matColumnDef="proveedor">
        <th mat-header-cell *matHeaderCellDef class="centrado">Proveedor</th>
        <td mat-cell *matCellDef="let renPed">{{ renPed.proveedor }}</td>
      </ng-container>

      <!-- Columna Codigo -->
      <ng-container matColumnDef="codigo">
        <th mat-header-cell *matHeaderCellDef class="centrado">Código</th>
        <td mat-cell *matCellDef="let renPed">
           {{ renPed.codigo }}
        </td>
      </ng-container>

      <!-- Columna Descripcion -->
      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef class="centrado">Descripción</th>
        <td mat-cell *matCellDef="let renPed">{{ renPed.descripcion }}</td>
      </ng-container>

       <!-- Columna Cantidad -->
      <ng-container matColumnDef="cantidad">
        <th mat-header-cell *matHeaderCellDef>Cantidad</th>
        <td mat-cell *matCellDef="let renPed">{{ renPed.cantidad }}</td>
      </ng-container>
     
      <!-- Columna coment -->
      <ng-container matColumnDef="coment">
        <th mat-header-cell *matHeaderCellDef class="centrado">Comentario</th>
        <td mat-cell *matCellDef="let renPed">{{ renPed.coment }}</td>
      </ng-container>
     
      <!-- Columna Modificar -->
      <ng-container matColumnDef="M">
        <th mat-header-cell *matHeaderCellDef >M</th>
        <td mat-cell *matCellDef="let renPed">         
           <div class="text-center">
            <button
              mat-icon-button
              class="action-btn"
              title="modificar item pedido"
              (click)="modificarItemPedido( renPed.nropedido,renPed.nrorenglon)">
              <i class="bi bi-pencil-fill"></i>
            </button>
           </div>                
        </td>
      </ng-container>
      <!-- Columna Borrar --> 
        <ng-container matColumnDef="B">
        <th mat-header-cell *matHeaderCellDef >B</th>
        <td mat-cell *matCellDef="let renPed">
      
          <div class="text-center">
              <button
              mat-icon-button
              class="action-btn"
              title="borrar item de pedido"
              (click)="eliminarItemPedido(renPed.nropedido,renPed.nrorenglon)">
              <i class="bi bi-trash-fill"></i>
             </button>
            </div>      
          </td>
      </ng-container>
      <!-- Definición de filas -->
      <tr mat-header-row *matHeaderRowDef="colDetPedido; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: colDetPedido">
      </tr>    
    </table>
  </div>
  }
  <!-- Sección inferior fija -->
  <div class="fixed-section footer-container">
     <div class="footer">         
  </div>      
  </div>      
</div> 
}
